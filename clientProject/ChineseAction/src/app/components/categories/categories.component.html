<h1>Categories Management</h1>
<label>name</label><br />
<input type="text" #addName /><br /><br />
<button
    (click)="add(addName.value)">Add</button>

<table>
    <thead>
        <tr>
            <th>קוד</th>
            <th>שם קטגוריה</th>
        </tr>
    </thead>
    <tbody>
        @for(c of categoriesList$ | async; track c.id){
        <tr>
            <td>{{c.id}}</td>
            <td>{{c.name}}</td>
            <td><input type="text" #txt{{$index}} [(ngModel)]="c.name" /></td>
            <td><button (click)="save(c)">Save</button>
                <button (click)="delete(c.id)">Delete</button>
            </td>
        </tr>
        }
    </tbody>
</table>
